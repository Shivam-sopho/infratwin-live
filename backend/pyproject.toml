[project]
name = "infratwin-backend"
version = "0.1.0"
description = "InfraTwin-Live API: corridor digital twin, live SHM telemetry, Meta Model API bridge"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic-settings>=2.4",
    "meta-sam-parser>=0.1.0",
    "numpy>=2.4.6",
    "pillow>=13.0.0",
    "python-multipart>=0.0.32",
    "av>=18.1.0",
    "scikit-image>=0.26.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
